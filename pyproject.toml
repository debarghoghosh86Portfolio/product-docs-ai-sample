[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docai"
version = "0.1.0"
description = "A beginner-friendly GenAI toolkit for product documentation: RAG Q&A + docs generator"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "scikit-learn", "python-dotenv", "requests"]

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
ui = ["streamlit"]
dev = ["pytest"]

[project.scripts]
docai = "docai.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
