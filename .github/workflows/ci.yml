# GitHub Actions: runs the tests automatically on every push / pull request.
# Uses the offline "mock" LLM, so no API keys are needed in CI.
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy scikit-learn python-dotenv requests pytest
      - name: Run tests
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: hashing
        run: pytest -q
